name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # Windows agar build mencerminkan target sebenarnya (net10.0-windows, Native AOT).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build

      - name: Build installer
        shell: pwsh
        run: .\tools\build-installer.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: opsifin-print-agent-msi
          path: dist/*.msi
